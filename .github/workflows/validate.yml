name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 0" # weekly, catches drift against new HA releases
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # brands: requires submitting an icon to home-assistant/brands (a
          # separate external repo/PR) — not needed for HACS custom-repository
          # installs, only for default-store listing. Revisit if this ever
          # gets submitted there.
          ignore: brands
